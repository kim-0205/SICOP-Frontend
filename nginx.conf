
# Servidor web para SICOP Frontend
server {
    # Puerto utilizado por OpenShift
    listen 8080;
    server_name localhost;

    # Archivos compilados de Vue
    root /usr/share/nginx/html;
    index index.html;

    # Permitir navegación con Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
