
# Despliegue continuo de SICOP Frontend
name: CD - SICOP Frontend

# Publicar únicamente cuando se actualice main
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Publicar imagen Vue en GHCR
    runs-on: ubuntu-latest

    steps:
      # Descargar nuestro proyecto
      - name: Obtener código
        uses: actions/checkout@v6

      # Preparar Docker Buildx
      - name: Configurar Docker
        uses: docker/setup-buildx-action@v4

      # Autenticarnos en GitHub Container Registry
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construir y publicar nuestra imagen Vue
      - name: Construir y publicar Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kim-0205/sicop-frontend:latest
            ghcr.io/kim-0205/sicop-frontend:${{ github.sha }}
