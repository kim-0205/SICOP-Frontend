
# Despliegue continuo de SICOP Frontend
name: CD - SICOP Frontend

# Publicar únicamente cuando se actualice main
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Publicar imagen Vue en GHCR
    runs-on: ubuntu-latest

    steps:
      # Descargar nuestro proyecto
      - name: Obtener código
        uses: actions/checkout@v6

      # Preparar Docker Buildx
      - name: Configurar Docker
        uses: docker/setup-buildx-action@v4

      # Autenticarnos en GitHub Container Registry
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construir y publicar nuestra imagen Vue
      - name: Construir y publicar Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kim-0205/sicop-frontend:latest
            ghcr.io/kim-0205/sicop-frontend:${{ github.sha }}


  # NUEVO: Desplegar automáticamente Vue en OpenShift
  desplegar:
    name: Actualizar Frontend en OpenShift
    runs-on: ubuntu-latest
    needs: docker

    steps:
      # Instalar OpenShift CLI
      - name: Instalar OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: '4'

      # Conectar con OpenShift
      - name: Conectar con OpenShift
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN_FRONTEND }}
          namespace: sicop-dev-dev

      # Publicar la nueva versión del Frontend
      - name: Actualizar contenedor Frontend
        run: |
          oc set image deployment/sicop-frontend sicop-frontend=ghcr.io/kim-0205/sicop-frontend:${{ github.sha }} -n sicop-dev-dev
          oc rollout status deployment/sicop-frontend -n sicop-dev-dev --timeout=180s

